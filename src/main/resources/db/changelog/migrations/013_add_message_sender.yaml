databaseChangeLog:
  - changeSet:
      id: 013-add-message-sender
      author: mxrty
      changes:
        - addColumn:
            tableName: messages
            columns:
              - column:
                  name: sender_id
                  type: integer
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: sender_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_messages_sender
